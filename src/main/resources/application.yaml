spring:
  application:
    name: ${APP_NAME:school-management-system}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/Documents/school-management/candidates;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  h2:
    console:
      path: /h2-console
      enabled: ${SPRING_H2_CONSOLE_ENABLED:false}

  messages:
    encoding: UTF-8
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  name: ${APP_DISPLAY_NAME:School Management System}
  subtitle: ${APP_SUBTITLE:Candidate Registry}
  vendor: ${APP_VENDOR:School Management System}

